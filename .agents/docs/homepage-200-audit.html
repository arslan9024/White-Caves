    .btn-filter {

      color: #FFF;
      border-color: var(--primary-red);

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1rem;
    }
    .item-card {
      background: var(--card-dark);

      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

    }
    .item-card:hover {
      transform: translateY(-2px);

ty":"P0","category":"10. SEO, Core Web Vitals & Sub-10ms Cache Engine","title":"Ensure zero render-blocking scripts in `<head>`."},{"id":"HP-200","priority":"P2","category":"10. SEO, Core Web Vitals & Sub-10ms Cache Engine","title":"Build automated Lighthouse CI test check in continuous integration pipelines."}];
    let activeFilter = 'all';
    let searchQuery = '';

    const grid = document.getElementById('matrixGrid');
    const searchInput = document.getElementById('searchInput');
    const filterButtons = document.querySelectorAll('.btn-filter');

    function render() {
      const filtered = items.filter(item => {
        const matchesFilter = activeFilter === 'all' || item.priority === activeFilter;
        const matchesSearch = !searchQuery || 
          item.id.toLowerCase().includes(searchQuery) ||
          item.title.toLowerCase().includes(searchQuery) ||
          item.category.toLowerCase().includes(searchQuery);
        return matchesFilter && matchesSearch;
      });

      grid.innerHTML = filtered.map(item => `
        <div class="item-card">
          <div>
            <div class="card-head">
              <span class="item-id">${item.id}</span>
              <span class="priority-pill ${item.priority}">${item.priority}</span>
            </div>
            <div class="card-cat">${item.category}</div>
            <div class="card-title">${item.title}</div>
          </div>
        </div>
      `).join('');
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        render();
      });
    });

    render();
  </script>
