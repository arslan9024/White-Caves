      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="700">🏢 Landlord Portal</text>
      <text x="15" y="42" fill="#38bdf8" font-size="11">Route: /landlord-portal</text>
      <text x="15" y="62" fill="#94a3b8" font-size="10">• Properties &amp; Units Owned</text>
      <text x="15" y="78" fill="#94a3b8" font-size="10">• Rent Inflow &amp; Maintenance</text>
      <text x="15" y="92" fill="#94a3b8" font-size="10">• Ejari Registration Copies</text>
    </g>

    <!-- Tenant -->
    <g transform="translate(245, 75)">
      <rect width="205" height="100" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="700">🔑 Tenant Portal</text>
      <text x="15" y="42" fill="#10b981" font-size="11">Route: /tenant-portal</text>
      <text x="15" y="62" fill="#94a3b8" font-size="10">• Active Lease Contract</text>
      <text x="15" y="78" fill="#94a3b8" font-size="10">• Rent Payments &amp; Cheques</text>
      <text x="15" y="92" fill="#94a3b8" font-size="10">• Maintenance Work Orders</text>
    </g>

    <!-- Buyer -->
    <g transform="translate(20, 190)">
      <rect width="205" height="105" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="700">🏠 Buyer Portal</text>
      <text x="15" y="42" fill="#6366f1" font-size="11">Route: /buyer-portal</text>
      <text x="15" y="62" fill="#94a3b8" font-size="10">• Favorite Saved Listings</text>
      <text x="15" y="78" fill="#94a3b8" font-size="10">• Form B &amp; MOU Documents</text>
      <text x="15" y="94" fill="#94a3b8" font-size="10">• Title Deed Tracking</text>
    </g>

    <!-- Seller -->
    <g transform="translate(245, 190)">
      <rect width="205" height="105" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="700">💰 Seller Portal</text>
      <text x="15" y="42" fill="#f59e0b" font-size="11">Route: /seller-portal</text>
      <text x="15" y="62" fill="#94a3b8" font-size="10">• Valuation &amp; Pricing Tools</text>
      <text x="15" y="78" fill="#94a3b8" font-size="10">• Form A Listing Agreements</text>
      <text x="15" y="94" fill="#94a3b8" font-size="10">• Offers &amp; Transfer Escrow</text>
    </g>
  </g>

  <!-- ==================== LEVEL 3B: STAFF OPERATING MESH (RANK 2) ==================== -->
  <g transform="translate(570, 485)" filter="url(#shadow)">
    <rect width="470" height="320" rx="14" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2" />
    <rect x="0" y="0" width="470" height="6" rx="3" fill="#ef4444" />

    <text x="25" y="35" fill="#f87171" font-size="16" font-weight="700">🛡️ AEGIS 13-FLOOR OPERATING MESH</text>
    <text x="25" y="55" fill="#94a3b8" font-size="11">Internal Staff, Brokers &amp; Executives (/dashboard) with Level 5 RBAC</text>

    <!-- Floor Cards -->
    <g transform="translate(20, 75)">
      <rect width="430" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="26" fill="#f1f5f9" font-size="12" font-weight="600">Floors 1 &amp; 2: Luxury Sales &amp; Strategic Off-Plan</text>
      <text x="350" y="26" fill="#ef4444" font-size="11" font-weight="700">@Hunter / @Daisy</text>
    </g>
    <g transform="translate(20, 125)">
      <rect width="430" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="26" fill="#f1f5f9" font-size="12" font-weight="600">Floor 4: Residential Leasing &amp; Tenant Screening</text>
      <text x="350" y="26" fill="#38bdf8" font-size="11" font-weight="700">@Mary</text>
    </g>
    <g transform="translate(20, 175)">
      <rect width="430" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="26" fill="#f1f5f9" font-size="12" font-weight="600">Floor 6: Revenue, Commission Splits &amp; VAT/Tax</text>
      <text x="350" y="26" fill="#f59e0b" font-size="11" font-weight="700">@Vesta</text>
    </g>
    <g transform="translate(20, 225)">
      <rect width="430" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="26" fill="#f1f5f9" font-size="12" font-weight="600">Floors 10 &amp; 11: RERA Compliance &amp; Conveyancing</text>
      <text x="350" y="26" fill="#10b981" font-size="11" font-weight="700">@Echo / @Mira</text>
    </g>
    <g transform="translate(20, 275)">
      <rect width="430" height="35" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="215" y="22" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle">Floor 13: Executive Council &amp; Sovereign Control Cockpit</text>
    </g>
  </g>

  <!-- Footer Indicator -->
  <g transform="translate(60, 825)">
    <text x="0" y="0" fill="#475569" font-size="11">White Caves AEGIS Architecture Standard • Zero Cross-Contamination Law • Single-Purpose File &amp; Deduplication Compliant</text>
  </g>
</svg>
