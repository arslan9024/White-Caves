# Docker Compose Configuration for Development

version: '3.8'

services:
  # Frontend
  frontend:
    build:
      context: .
      target: builder
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - VITE_WS_BASE_URL=ws://localhost:5000
    command: npm run dev
    networks:
      - whatsapp-network

  # Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=mongodb://mongo:27017/whatsapp
      - JWT_SECRET=dev-secret-key
    depends_on:
      - mongo
    networks:
      - whatsapp-network

  # MongoDB
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - whatsapp-network

  # Redis (for caching)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - whatsapp-network

volumes:
  mongo-data:
  redis-data:

networks:
  whatsapp-network:
    driver: bridge
