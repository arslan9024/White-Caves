<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C9A84C" />
    <title>Offline — White Caves Real Estate</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --color-bg: #0a0a0f;
        --color-surface: #141414;
        --color-border: #2a2a2a;
        --color-gold: #c9a84c;
        --color-text-primary: #f5f5f0;
        --color-text-muted: #888;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--color-bg);
        color: var(--color-text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }

      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 2.5rem 2rem;
        max-width: 440px;
        width: 100%;
        text-align: center;
      }

      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        color: var(--color-gold);
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: var(--color-gold);
      }

      p {
        color: var(--color-text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }

      .btn {
        display: inline-block;
        background: var(--color-gold);
        color: #0a0a0f;
        font-weight: 600;
        padding: 0.7rem 1.75rem;
        border-radius: 8px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        font-size: 0.95rem;
        transition: opacity 0.2s;
      }

      .btn:hover {
        opacity: 0.88;
      }

      .brand {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: var(--color-text-muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 15.75V21h18v-5.25M3 15.75L12 3l9 12.75M3 15.75h18"/>
      </svg>

      <h1>You're Offline</h1>

      <p>
        It looks like you've lost your internet connection. Please check your network settings and
        try again. Your previously viewed properties are still accessible in your browser cache.
      </p>

      <button class="btn" onclick="location.reload()">Try Again</button>

      <p class="brand">White Caves Real Estate &mdash; Dubai</p>
    </div>
  </body>
</html>
