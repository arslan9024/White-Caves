name: Lighthouse CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: '.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format Lighthouse Score
        if: github.event_name == 'pull_request'
        id: format
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json', 'utf8'));

            let body = '## 🔦 Lighthouse Report\n\n';
            body += '| Page | Performance | Accessibility | Best Practices | SEO |\n';
            body += '|------|------------|---------------|----------------|-----|\n';

            for (const result of results) {
              const summary = result.summary;
              const url = new URL(result.url).pathname || '/';
              const perf = Math.round(summary.performance * 100);
              const a11y = Math.round(summary.accessibility * 100);
              const bp = Math.round(summary['best-practices'] * 100);
              const seo = Math.round(summary.seo * 100);

              const emoji = (score) => score >= 90 ? '🟢' : score >= 50 ? '🟠' : '🔴';

              body += `| \`${url}\` | ${emoji(perf)} ${perf} | ${emoji(a11y)} ${a11y} | ${emoji(bp)} ${bp} | ${emoji(seo)} ${seo} |\n`;
            }

            body += '\n_Scores are median of 3 runs on desktop preset._\n';
            body += `\n[📊 Full Report](${results[0]?.htmlPath || '#'})`;

            core.setOutput('body', body);

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse
          message: ${{ steps.format.outputs.body }}
