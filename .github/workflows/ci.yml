name: Continuous Integration

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true

jobs:
  # ───────────────────────────────────────────────────
  # Gate 1: Build + Lint + Type-check (fast — blocks all others)
  # ───────────────────────────────────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present

      - name: Build (Vite production)
        run: npm run build

      - name: Upload build artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ───────────────────────────────────────────────────
  # Gate 2: Unit Tests + Coverage (runs after build)
  # ───────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests with coverage
        run: npm test -- --run --reporter=verbose --coverage --coverage.reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ───────────────────────────────────────────────────
  # Gate 3: E2E Tests (runs after build)
  # ───────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Start development server
        run: npm run dev &

      - name: Wait for server
        run: npx wait-on http://localhost:5000 --timeout 60000

      - name: Run E2E tests
        run: npx playwright test --reporter=html

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-report
          path: playwright-report/
          retention-days: 14

  # ───────────────────────────────────────────────────
  # Gate 4: Security Audit (runs after build)
  # ───────────────────────────────────────────────────
  security:
    name: Security Audit
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: npm audit (production only)
        run: npm audit --production --audit-level=high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npx audit-ci --high
        continue-on-error: true

  # ───────────────────────────────────────────────────
  # Gate 5: Bundle Size Check (PR only — protect main)
  # ───────────────────────────────────────────────────
  bundle-size:
    name: Bundle Size Check
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Report bundle sizes
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzip |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in dist/assets/*.js; do
            size=$(stat -c%s "$f" 2>/dev/null || echo "0")
            gzip_size=$(gzip -c "$f" | wc -c)
            size_kb=$(echo "scale=1; $size/1024" | bc)
            gzip_kb=$(echo "scale=1; $gzip_size/1024" | bc)
            name=$(basename "$f")
            echo "| $name | ${size_kb}KB | ${gzip_kb}KB |" >> $GITHUB_STEP_SUMMARY
          done
          total=$(du -sb dist/ | cut -f1)
          total_mb=$(echo "scale=2; $total/1048576" | bc)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: ${total_mb}MB**" >> $GITHUB_STEP_SUMMARY

      - name: Fail if vendor chunk exceeds 500KB
        run: |
          vendor_size=$(stat -c%s dist/assets/vendor-*.js 2>/dev/null || echo "0")
          limit=512000
          if [ "$vendor_size" -gt "$limit" ]; then
            echo "⚠️ Vendor chunk (${vendor_size} bytes) exceeds 500KB limit"
          fi
