name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    branches: [main]
    types: [completed]permissions:
  contents: write

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    timeout-minutes: 45
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Run tests before deploy
        run: npm run test:forks
      
      - name: Verify staging runtime endpoints
        env:
          RUNTIME_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -z "$RUNTIME_URL" ]; then
            echo "ℹ️ STAGING_URL secret not configured. Skipping runtime endpoint verification."
            exit 0
          fi
          npm run verify:runtime -- --url="$RUNTIME_URL" --timeout=15000 --retries=6 --retry-delay=5000
      
      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e
        continue-on-error: true
        with:
          status: ${{ job.status }}
          text: 'Staging deployment: ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  smoke-tests:
    runs-on: ubuntu-24.04
    needs: deploy-staging
    if: success()
    timeout-minutes: 35
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Run smoke tests
        run: |
          if [ -z "$TEST_BASE_URL" ]; then
            echo "ℹ️ STAGING_URL not set; running local smoke tests."
          fi
          npm run test:e2e:smoke
        env:
          TEST_BASE_URL: ${{ secrets.STAGING_URL }}
      
      - name: Upload smoke test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-tests-report
          path: playwright-report/
          retention-days: 7

  deploy-production:
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: success()
    timeout-minutes: 50
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Run final tests
        run: npm run test:forks
      
      - name: Verify production runtime endpoints
        env:
          RUNTIME_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ -z "$RUNTIME_URL" ]; then
            echo "ℹ️ PROD_URL secret not configured. Skipping runtime endpoint verification."
            exit 0
          fi
          npm run verify:runtime -- --url="$RUNTIME_URL" --timeout=15000 --retries=6 --retry-delay=5000
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}-${{ github.run_attempt }}
          name: Release v${{ github.run_number }}
          body: |
            Automated production deployment
            Commit: ${{ env.DEPLOY_SHA }}
            Branch: ${{ github.ref }}
          draft: false
          prerelease: false
      
      - name: Notify success
        if: success()
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e
        continue-on-error: true
        with:
          status: success
          text: |
            ✅ *Production Deployment Successful*
            Version: v${{ github.run_number }}
            Commit: ${{ env.DEPLOY_SHA }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Notify failure
        if: failure()
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e
        continue-on-error: true
        with:
          status: failure
          text: |
            ❌ *Production Deployment Failed*
            Commit: ${{ env.DEPLOY_SHA }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  monitoring:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    timeout-minutes: 20
    
    steps:
      - name: Check production health
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "ℹ️ PROD_URL not configured. Skipping remote health curl check."
            exit 0
          fi
          echo "Checking production health at $PROD_URL/api/health..."
          curl -f "$PROD_URL/api/health" || exit 1
      
      - name: Notify monitoring
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e
        continue-on-error: true
        with:
          status: ${{ job.status }}
          text: 'Production monitoring: ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
