name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    timeout-minutes: 45
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Run tests before deploy
        run: npm run test:forks
      
      - name: Build Docker image
        run: docker build -f Dockerfile.prod -t white-caves:staging-${{ env.DEPLOY_SHA }} .
      
      - name: Deploy to staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_COMMAND: ${{ secrets.STAGING_DEPLOY_COMMAND }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          if [ -z "$DEPLOY_COMMAND" ]; then
            echo "❌ STAGING_DEPLOY_COMMAND secret is missing. Configure the remote deployment command."
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_COMMAND"

      - name: Verify staging runtime endpoints
        env:
          RUNTIME_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -z "$RUNTIME_URL" ]; then
            echo "❌ STAGING_URL secret is missing."
            exit 1
          fi
          npm run verify:runtime -- --url="$RUNTIME_URL" --timeout=15000 --retries=6 --retry-delay=5000
      
      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e
        continue-on-error: true
        with:
          status: ${{ job.status }}
          text: 'Staging deployment: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  smoke-tests:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: success()
    timeout-minutes: 35
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Run smoke tests
        run: npm run test:e2e:smoke
        env:
          TEST_BASE_URL: ${{ secrets.STAGING_URL }}
      
      - name: Upload smoke test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-tests-report
          path: playwright-report/
          retention-days: 7

  deploy-production:
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: success()
    timeout-minutes: 50
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Run final tests
        run: npm test -- --run
      
      - name: Build production Docker image
        run: docker build -f Dockerfile.prod -t white-caves:latest -t white-caves:${{ env.DEPLOY_SHA }} .
      
      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
          DEPLOY_COMMAND: ${{ secrets.PROD_DEPLOY_COMMAND }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          if [ -z "$DEPLOY_COMMAND" ]; then
            echo "❌ PROD_DEPLOY_COMMAND secret is missing. Configure the remote deployment command."
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_COMMAND"

      - name: Verify production runtime endpoints
        env:
          RUNTIME_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ -z "$RUNTIME_URL" ]; then
            echo "❌ PROD_URL secret is missing."
            exit 1
          fi
          npm run verify:runtime -- --url="$RUNTIME_URL" --timeout=15000 --retries=6 --retry-delay=5000
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}-${{ github.run_attempt }}
          name: Release v${{ github.run_number }}
          body: |
            Automated production deployment
            Commit: ${{ env.DEPLOY_SHA }}
            Branch: ${{ github.ref }}
          draft: false
          prerelease: false
      
      - name: Notify success
        if: success()
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e
        continue-on-error: true
        with:
          status: success
          text: |
            ✅ *Production Deployment Successful*
            Version: v${{ github.run_number }}
            Commit: ${{ env.DEPLOY_SHA }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Notify failure
        if: failure()
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e
        continue-on-error: true
        with:
          status: failure
          text: |
            ❌ *Production Deployment Failed*
            Commit: ${{ env.DEPLOY_SHA }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  monitoring:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    timeout-minutes: 20
    
    steps:
      - name: Check production health
        run: |
          echo "Checking production health..."
          # Add health check endpoints here
          curl -f ${{ secrets.PROD_URL }}/api/health || exit 1
      
      - name: Verify metrics
        run: |
          echo "Verifying production metrics..."
          # Add monitoring verification here
      
      - name: Notify monitoring
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e
        continue-on-error: true
        with:
          status: ${{ job.status }}
          text: 'Production monitoring: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
