name: Deployment Verification

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing deployment to verify (this workflow does not deploy)
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.deployment.id || inputs.environment }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Resolve deployment under verification
        env:
          EVENT_URL: ${{ github.event.deployment_status.environment_url }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
          PROD_URL: ${{ secrets.PROD_URL }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const configured = [process.env.STAGING_URL, process.env.PROD_URL].filter(Boolean);
          const raw = process.env.EVENT_URL || (
            process.env.ENVIRONMENT === 'production' ? process.env.PROD_URL : process.env.STAGING_URL
          );
          if (!raw) throw new Error('Configure STAGING_URL or PROD_URL before verification');
          const url = new URL(raw);
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash)
            throw new Error('Deployment URL must be an HTTPS URL without credentials or query');
          const approved = new Set(['https://whitecaves.com', 'https://www.whitecaves.com',
            'https://white-caves.vercel.app', ...configured.map(value => new URL(value).origin)]);
          if (!approved.has(url.origin)) throw new Error('Deployment origin is not approved');
          appendFileSync(process.env.GITHUB_ENV, `TEST_BASE_URL=${url.origin}\n`);
          JS
      - name: Verify runtime endpoints
        run: npm run verify:runtime -- --url="$TEST_BASE_URL" --timeout=15000 --retries=6 --retry-delay=5000
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed smoke journeys
        run: npm run test:e2e:smoke -- --project=chromium
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Record verification result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Deployment verification: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosting is managed by the Vercel Git integration; no deployment or release was created by this workflow." >> "$GITHUB_STEP_SUMMARY"
