# Docker Compose Configuration for Production

version: '3.8'

services:
  # Frontend + Backend (combined)
  app:
    image: whiteaves:latest
    container_name: whiteaves-app
    restart: always
    ports:
      - "80:3000"
      - "443:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - VITE_API_BASE_URL=https://api.whiteaves.com
      - VITE_WS_BASE_URL=wss://api.whiteaves.com
    depends_on:
      - mongo
      - redis
    networks:
      - whiteaves-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB
  mongo:
    image: mongo:7
    container_name: whiteaves-mongo
    restart: always
    volumes:
      - mongo-data:/data/db
      - ./backup:/backup
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    networks:
      - whiteaves-network
    ports:
      - "27017:27017"

  # Redis
  redis:
    image: redis:7-alpine
    container_name: whiteaves-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - whiteaves-network
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: whiteaves-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - whiteaves-network

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  whiteaves-network:
    driver: bridge
