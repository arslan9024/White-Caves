# Production Docker Compose Configuration
# Includes: Node.js app, MongoDB, Redis, Nginx reverse proxy

version: '3.8'

services:
  # Main application server
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: white-caves-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/whitecaves}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set for production}
      - WHATSAPP_OWNER_EMAIL=${WHATSAPP_OWNER_EMAIL:-arslanmalikgoraha@gmail.com}
      - API_URL=${API_URL:-http://localhost:5000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5000}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - white-caves-network
    volumes:
      - ./logs:/app/logs  # Mount logs to host for backup
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MongoDB Database
  mongodb:
    image: mongo:7.0-alpine
    container_name: white-caves-mongodb
    environment:
      - MONGO_INITDB_DATABASE=whitecaves
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?MONGO_PASSWORD must be set for production}
    # SECURITY: No host port mapping — only accessible via internal Docker network
    # To debug, temporarily add: ports: ["127.0.0.1:27017:27017"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - white-caves-network
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: white-caves-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production}
    # SECURITY: No host port mapping — only accessible via internal Docker network
    # To debug, temporarily add: ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped
    healthcheck:
      # Use REDISCLI_AUTH env var instead of -a flag to avoid leaking password in process list
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - white-caves-network
    volumes:
      - redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (optional, for better performance)
  nginx:
    image: nginx:alpine
    container_name: white-caves-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - white-caves-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  white-caves-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local
