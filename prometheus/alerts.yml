# Prometheus alert rules for White Caves backend

groups:
  - name: whitecaves-backend
    rules:
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "95th percentile request latency > 1s"
          description: "High latency observed on {{ $labels.instance }}"

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{code=~'5..'}[5m])) by (instance) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate > 5%"
          description: "Too many 5xx responses on {{ $labels.instance }}"
